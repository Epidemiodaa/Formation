<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Plateforme de formation</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0b6e4f">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Formation">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{--bg:#f6f7f9;--card:#fff;--tx:#1d2733;--mu:#64707d;--pr:#0b6e4f;--bd:#dde2e8;--er:#b3261e}
@media(prefers-color-scheme:dark){:root{--bg:#14181d;--card:#1d242c;--tx:#e8ecf0;--mu:#9aa6b2;--pr:#3cc28f;--bd:#2f3943;--er:#f2827b}}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
*{box-sizing:border-box}body{margin:0;min-height:100vh;min-height:100dvh;overflow-wrap:anywhere;font:16px/1.5 system-ui,sans-serif;background:var(--bg);color:var(--tx)}
header{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:4px;padding:12px max(16px,env(safe-area-inset-right)) 12px max(16px,env(safe-area-inset-left));padding-top:max(12px,env(safe-area-inset-top));z-index:5;background:var(--card);border-bottom:1px solid var(--bd);position:sticky;top:0}
header b{color:var(--pr)}main{max-width:760px;margin:0 auto;padding:16px max(16px,env(safe-area-inset-right)) max(16px,env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left))}
img,svg,video,iframe{max-width:100%}
/* Tablette / rotation : la mise en page suit l'orientation (portrait, paysage, tous les sens) */
@media(min-width:900px){main{max-width:1000px}.chw{width:140px}#app>.card,#app>h2,#app>h3{max-width:100%}}
@media(min-width:900px) and (orientation:landscape){.tabs button,.steps button{padding:9px 16px}}
@media(max-height:520px) and (orientation:landscape){.chw{width:78px}.stage{padding:8px}.bub{margin:10px 0 6px}header{position:static}}
.card{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:14px;margin:10px 0}
button,input,textarea,select{font:inherit;color:inherit}
button{background:var(--pr);color:#fff;border:0;border-radius:8px;padding:8px 14px;cursor:pointer}
button.s{background:none;color:var(--pr);border:1px solid var(--pr)}button.l{background:none;color:var(--mu);padding:4px 8px}
input,textarea,select{width:100%;padding:8px;margin:4px 0 10px;border:1px solid var(--bd);border-radius:8px;background:var(--bg)}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0}.tabs button{background:none;color:var(--tx);border:1px solid var(--bd)}.tabs button.on{background:var(--pr);color:#fff}
.mu{color:var(--mu);font-size:.9em}.er{color:var(--er)}.ok{color:var(--pr)}
.msg{padding:6px 0;border-bottom:1px solid var(--bd)}.msg.me{background:rgba(11,110,79,.07)}
table{border-collapse:collapse;font-size:.9em;margin:6px 0}th,td{border:1px solid var(--bd);padding:3px 7px;text-align:center}select{width:auto;max-width:100%;margin:4px 4px 4px 0}
.dz{border:2px dashed var(--bd);border-radius:10px;padding:10px;margin:10px 0}.dz.over{border-color:var(--pr);background:rgba(11,110,79,.08)}.dz .msg[draggable=true]{cursor:grab}.lk{color:var(--pr);text-decoration:underline;cursor:pointer}
/* Personnages animés (introduction des modules) */
.stage{background:linear-gradient(#e6f5ee,var(--card));border:1px solid var(--bd);border-radius:12px;padding:12px;margin:10px 0}
.chars{display:flex;justify-content:space-around;align-items:flex-end}
.chw{width:112px;text-align:center;transition:opacity .3s,transform .3s}.chw.idle{opacity:.55;transform:scale(.93)}.chw b{font-size:.85em;color:var(--mu)}
.chw svg{width:100%;height:auto;display:block}
.chw .body{animation:bob 3s ease-in-out infinite}.chw .eye,.chw .mouth,.chw .ant,.chw .arm{transform-box:fill-box}
.chw .eye{transform-origin:center;animation:blink 4.5s infinite}.chw .ant{transform-origin:center;animation:pulse 1.6s ease-in-out infinite}
.chw .mouth{transform-origin:center}.chw.talk .mouth{animation:talk .22s ease-in-out infinite alternate}
.chw .arm{transform-origin:50% 0}.chw.hello .arm{animation:wave .7s ease-in-out infinite alternate}
@keyframes bob{50%{transform:translateY(-4px)}}@keyframes blink{0%,93%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}
@keyframes pulse{50%{transform:scale(1.35);opacity:.7}}@keyframes talk{to{transform:scaleY(2.6)}}@keyframes wave{from{transform:rotate(-8deg)}to{transform:rotate(-55deg)}}
.bub{position:relative;background:var(--card);border:2px solid var(--pr);border-radius:14px;padding:10px 12px;margin:14px 0 8px;min-height:3.4em}
.bub::before{content:"";position:absolute;top:-10px;width:16px;height:16px;background:var(--card);border-left:2px solid var(--pr);border-top:2px solid var(--pr);transform:rotate(45deg)}
.bub.l::before{left:20%}.bub.r::before{right:20%}
.steps{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0}.steps button{background:none;color:var(--tx);border:1px solid var(--bd);padding:6px 11px}.steps button.on{background:var(--pr);color:#fff;border-color:var(--pr)}.steps button.ok2{border-color:var(--pr);color:var(--pr)}.steps button.on.ok2{color:#fff}.steps button:disabled{opacity:.45;cursor:not-allowed}
.nav2{display:flex;justify-content:space-between;gap:8px;margin:14px 0;flex-wrap:wrap}.nav2 button:disabled{opacity:.45;cursor:not-allowed}
@media(prefers-reduced-motion:reduce){.chw *{animation:none!important}}
label.o{display:block;padding:6px 8px;border:1px solid var(--bd);border-radius:8px;margin:4px 0;cursor:pointer}label.o input{width:auto;margin:0 8px 0 0}
</style>
</head>
<body>
<header><b>Plateforme de formation</b><span><button id="inst" class="s" style="display:none" onclick="installApp()">📲 Installer</button><span id="nav"></span></span></header>
<main id="app"></main>
<script>
// >>> Coller ici l'URL /exec du déploiement Apps Script <<<
const API_URL = 'https://script.google.com/macros/s/AKfycbzmylSAU7ocsFHMVDGNaO2jladI_obqWVw8m-4pkVr4R1gVxmZU8kRQjwqSfczdIVEE/exec';
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let tmr = null, typ = null;
let tok = localStorage.getItem('tok'), pseudo = localStorage.getItem('pseudo'), adminPw = null, timer = null, cur = null;

async function api(action, ...args) {
  if (!/^https:\/\/script\.google(usercontent)?\.com\//.test(API_URL))
    return { ok: false, message: 'Adresse du serveur non configurée : remplacez COLLER_ICI_URL_EXEC au début du script de index.html par l’URL /exec de votre déploiement Apps Script.' };
  let res;
  try { res = await fetch(API_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ action, args }) }); }
  catch (e) { return { ok: false, message: 'Pas de connexion au serveur. Vérifiez internet, puis que le déploiement Apps Script est « Exécuter en tant que : moi » et « Accès : tout le monde ».' }; }
  const txt = await res.text();
  try { return JSON.parse(txt); }
  catch (e) { return { ok: false, message: 'Le serveur a répondu autre chose que des données (autorisation ou déploiement à refaire : exécutez setup() dans Apps Script, puis redéployez en « Nouvelle version »).' }; }
}
function view(html) { clearInterval(timer); clearInterval(tmr); clearInterval(typ); $('#app').innerHTML = html; window.scrollTo(0, 0); }
function nav() {
  $('#nav').innerHTML = tok ? `<button class="l" onclick="home()">Mes cours</button><button class="l" onclick="profile()">${esc(pseudo)}</button><button class="l" onclick="logout()">Quitter</button>` : `<button class="l" onclick="admin()">Admin</button>`;
}
function setSession(r) { tok = r.token; pseudo = r.pseudo; localStorage.setItem('tok', tok); localStorage.setItem('pseudo', pseudo); }
function logout() { tok = null; localStorage.clear(); auth(); }
function fail(r) { if (/Session expirée/.test(r.message || '')) return logout(); alert(r.message || 'Erreur'); }

/* ---------- Connexion / inscription ---------- */
function auth(msg) {
  nav();
  view(`<div class="card"><h2>Bienvenue</h2><p class="mu">Première visite ? Choisissez un pseudonyme et un mot de passe : votre compte est créé tout de suite, sans validation.</p>
  <input id="p" placeholder="Pseudonyme (3 à 30 caractères, sans espace)" autocapitalize="off"><input id="w" type="password" placeholder="Mot de passe (6 caractères minimum)">
  <p class="er" id="m">${esc(msg || '')}</p><button onclick="doAuth()">Continuer</button></div>`);
}
async function doAuth() {
  const r = await api('login', $('#p').value, $('#w').value);
  if (!r.ok) return ($('#m').textContent = r.message);
  setSession(r); if (r.created) alert('Compte créé. Bienvenue !'); home();
}

/* ---------- Accueil : mes cours + catalogue ---------- */
async function home() {
  if (!tok) return auth(); nav(); view('<p class="mu">Chargement…</p>');
  const r = await api('me', tok); if (!r.ok) return fail(r);
  const item = c => `<div class="card"><b>${esc(c.titre)}</b><p class="mu">${esc(c.description)}</p>${c.inscrit
    ? `<button onclick="openCourse('${c.id}')">Ouvrir</button> <button class="l" onclick="leave('${c.id}')">Me désinscrire</button>`
    : `<button class="s" onclick="join('${c.id}')">S’inscrire</button>`}</div>`;
  const mine = r.cours.filter(c => c.inscrit), other = r.cours.filter(c => !c.inscrit);
  view(`<h2>Mes cours</h2>${mine.map(item).join('') || '<p class="mu">Vous n’êtes inscrit à aucun cours.</p>'}<h2>Cours disponibles</h2>${other.map(item).join('') || '<p class="mu">Aucun autre cours.</p>'}`);
}
async function join(id) { const r = await api('enroll', tok, id); r.ok ? openCourse(id) : fail(r); }
async function leave(id) { if (confirm('Se désinscrire de ce cours ?')) { await api('unenroll', tok, id); home(); } }

/* ---------- Profil ---------- */
async function profile() {
  view('<p class="mu">Chargement…</p>');
  const r = await api('profil', tok); if (!r.ok) return fail(r);
  view(`<div class="card"><h2>Mon profil</h2><p class="mu">Compte créé le ${new Date(r.cree).toLocaleDateString('fr-FR')}</p>
  <label>Pseudonyme</label><input id="np" value="${esc(r.pseudo)}" autocapitalize="off">
  <label>Nouveau mot de passe (laisser vide pour ne pas changer)</label><input id="nw" type="password" placeholder="6 caractères minimum">
  <p id="m" class="er"></p><button onclick="saveProfile()">Enregistrer</button></div>
  <h3>Mes cours et résultats</h3>${r.cours.map(c => `<div class="card"><b>${esc(c.titre)}</b><p class="mu">Pré-test : ${c.pre || 'non passé'} · Post-test : ${c.post || 'non passé'}</p><button class="s" onclick="openCourse('${c.id}')">Ouvrir</button></div>`).join('') || '<p class="mu">Aucune inscription.</p>'}`);
}
async function saveProfile() {
  const r = await api('updateProfile', tok, $('#np').value, $('#nw').value);
  if (!r.ok) return ($('#m').className = 'er', $('#m').textContent = r.message);
  pseudo = r.pseudo; localStorage.setItem('pseudo', pseudo); nav(); $('#nw').value = ''; $('#m').className = 'ok'; $('#m').textContent = 'Enregistré.';
}

/* ---------- Page d'un cours ---------- */
async function openCourse(id, tab) {
  view('<p class="mu">Chargement…</p>');
  const r = await api('course', tok, id); if (!r.ok) { fail(r); return home(); }
  cur = r; tab = tab || (r.verrous.docs ? 'Pré-test' : 'docs');
  const T = [['docs', 'Cours'], ['Pré-test', 'Pré-test'], ['Post-test', 'Post-test'], ['chat', 'Discussion']], base = tab.indexOf('quiz:') === 0 ? 'docs' : tab;
  view(`<h2>${esc(r.titre)}</h2><p class="mu">${esc(r.description)}</p>
  <div class="tabs">${T.map(t => `<button class="${t[0] === base ? 'on' : ''}" onclick="openCourse('${id}','${t[0]}')">${lockOf(t[0]) ? '🔒 ' : ''}${t[1]}</button>`).join('')}</div><div id="tab"></div>`);
  if (tab === 'docs') docsTab(id);
  else if (base !== tab) quizHome(id, tab.slice(5));
  else if (tab === 'chat') chat(id);
  else testHome(id, tab);
}

/* ---------- Cours : modules (documents à lire, puis quiz) ---------- */
// Ordre : pré-test (sauf s'il est facultatif) → modules dans l'ordre (documents lus et marqués, puis quiz réussi) → post-test. Le serveur applique les mêmes règles.
const lockOf = t => t === 'docs' ? cur.verrous.docs : t === 'Post-test' ? cur.verrous.post && !cur.resultats['Post-test'] : false;
let modIdx = null;
function docCard(id, d) {
  return `<div class="card">📄 <a href="${esc(d.url)}" target="_blank" rel="noopener" ${d.facultatif ? '' : `onclick="docOpened('${id}','${d.id}')"`}>${esc(d.titre)}</a>${d.facultatif ? '' : `
      <div id="dz_${d.id}">${docState(id, d)}</div>`}</div>`;
}
const stepsOf = () => cur.sequences.map(s => ({ s })).concat(cur.ressources.length ? [{ res: true }] : []);
function moduleBody(id, s, n) {
  const req = s.documents.filter(d => !d.facultatif), opt = s.documents.filter(d => d.facultatif), q = s.quiz;
  return `<div class="card"><h3>${s.virtual ? '' : 'Module ' + n + ' — '}${esc(s.titre)} ${s.complete ? '<span class="ok">✔ terminé</span>' : ''}</h3>
    ${req.length ? `<p class="mu">Documents lus : <b>${s.lus} / ${s.total}</b></p>` : ''}<button class="l" onclick="replayIntro('${id}','${s.id}')">▶ Revoir l’introduction</button></div>`
    + req.map(d => docCard(id, d)).join('')
    + (opt.length ? '<p class="mu">Ressources facultatives de ce module :</p>' + opt.map(d => docCard(id, d)).join('') : '')
    + (q ? `<div class="card"><b>📝 Quiz du module</b> <span class="mu">(${q.n} question${q.n > 1 ? 's' : ''}${q.seuil > 0 ? ' · réussite à partir de ' + q.seuil + ' %' : ''})</span>`
      + (q.reussi ? `<p class="ok">✔ Quiz réussi : ${q.meilleur.score} / ${q.meilleur.total}</p><button class="s" onclick="openCourse('${id}','quiz:${s.id}')">Revoir ma correction</button>`
        : !s.lu ? '<p class="mu">🔒 Le quiz s’ouvre quand tous les documents obligatoires de ce module sont marqués comme lus.</p>'
        : q.essais ? `<p class="er">Dernier essai : ${q.dernier.score} / ${q.dernier.total} — il faut ${q.seuil} % pour passer au module suivant.</p><button onclick="openCourse('${id}','quiz:${s.id}')">Voir la correction et réessayer</button>`
        : `<p class="mu">Tous les documents sont lus : le quiz est ouvert.${q.seuil > 0 ? ' Il faut le réussir pour débloquer le module suivant.' : ''}</p><button onclick="openCourse('${id}','quiz:${s.id}')">Passer le quiz</button>`) + '</div>' : '');
}
function docsTab(id, idx) {
  if (cur.verrous.docs) return $('#tab').innerHTML = `<div class="card"><b>🔒 Cours verrouillé</b><p class="mu">Passez d’abord le pré-test : le contenu du cours s’affichera ensuite.</p><button onclick="openCourse('${id}','Pré-test')">Aller au pré-test</button></div>`;
  const st = stepsOf(), V = cur.verrous, blocs = cur.blocs.map(b => `<div class="card">${b.titre ? '<b>' + esc(b.titre) + '</b><br>' : ''}${esc(b.texte).replace(/\n/g, '<br>')}</div>`).join('');
  const postBtn = !V.post && cur.nbQuestions['Post-test'] && !cur.resultats['Post-test'] ? `<button onclick="openCourse('${id}','Post-test')">Passer au post-test ▸</button>` : '';
  if (!st.length) return $('#tab').innerHTML = blocs + '<p class="mu">Aucun contenu pour le moment.</p>' + postBtn;
  if (idx === undefined) { const f = st.findIndex(x => x.s && !x.s.complete && !x.s.verrouille); idx = modIdx !== null && modIdx < st.length && modIdx >= 0 ? modIdx : (f >= 0 ? f : st.length - 1); }
  if (st[idx].s && st[idx].s.verrouille) idx = Math.max(0, st.findIndex(x => x.s && x.s.verrouille) - 1);
  modIdx = idx;
  let n = 0; const num = st.map(x => x.s && !x.s.virtual ? ++n : 0);
  const stepper = `<div class="steps">${st.map((x, i) => x.res ? `<button class="${i === idx ? 'on' : ''}" onclick="docsTab('${id}',${i})">📎 Ressources</button>`
    : `<button class="${i === idx ? 'on' : ''} ${x.s.complete ? 'ok2' : ''}" ${x.s.verrouille ? 'disabled' : ''} onclick="docsTab('${id}',${i})" title="${esc(x.s.titre)}">${x.s.verrouille ? '🔒' : x.s.complete ? '✔' : ''} ${x.s.virtual ? 'Intro' : 'Module ' + num[i]}</button>`).join('')}</div>`;
  const cu = st[idx], nx = st[idx + 1], pv = st[idx - 1];
  const nextOk = nx && !(nx.s && nx.s.verrouille);
  let body;
  if (cu.res) body = '<h3>Ressources complémentaires</h3><p class="mu">Facultatives : à consulter librement, sans effet sur l’accès au post-test.</p>' + cur.ressources.map(d => docCard(id, d)).join('');
  else if (!introSeen(id, cu.s.id)) body = introHtml();
  else body = moduleBody(id, cu.s, num[idx]);
  const hint = nx && !nextOk ? '<p class="mu" style="text-align:right">Terminez ce module (documents lus et quiz réussi) pour ouvrir le suivant.</p>' : '';
  $('#tab').innerHTML = blocs + stepper + body
    + `<div class="nav2"><button class="s" ${pv ? '' : 'disabled'} onclick="docsTab('${id}',${idx - 1})">◂ Module précédent</button>`
    + (nx ? `<button ${nextOk ? '' : 'disabled'} onclick="docsTab('${id}',${idx + 1})">Module suivant ▸</button>` : postBtn || '<span></span>') + '</div>' + hint
    + `<p class="mu">Modules terminés : ${V.seqTotal - V.seqRestantes} / ${V.seqTotal}${V.seqTotal ? (V.post ? ' — le post-test s’ouvre quand tous les modules sont terminés.' : ' — le post-test est débloqué.') : ''}</p>`;
  if (!cu.res && !introSeen(id, cu.s.id)) introStart(id, cu.s);
}

/* ---------- Introduction des modules : personnages animés (SVG + CSS, sans serveur) ---------- */
const AWA = `<svg viewBox="0 0 120 170" aria-hidden="true"><ellipse cx="60" cy="165" rx="38" ry="5" fill="rgba(0,0,0,.15)"/><g class="body"><circle cx="60" cy="40" r="31" fill="#1f1a17"/>
  <rect x="30" y="76" width="60" height="84" rx="14" fill="#fff" stroke="#cfd6dc"/><path d="M46 76 L60 106 L74 76 Z" fill="#0b6e4f"/><rect x="53" y="64" width="14" height="14" fill="#8a5a3c"/>
  <rect x="22" y="80" width="14" height="52" rx="7" fill="#fff" stroke="#cfd6dc"/><circle cx="29" cy="136" r="7" fill="#8a5a3c"/>
  <g class="arm"><rect x="84" y="80" width="14" height="46" rx="7" fill="#fff" stroke="#cfd6dc"/><circle cx="91" cy="128" r="7" fill="#8a5a3c"/></g>
  <circle cx="60" cy="48" r="25" fill="#8a5a3c"/><ellipse class="eye" cx="50" cy="46" rx="3" ry="4" fill="#111"/><ellipse class="eye" cx="70" cy="46" rx="3" ry="4" fill="#111"/>
  <path d="M43 39 Q50 35 57 39M63 39 Q70 35 77 39" stroke="#1f1a17" stroke-width="2" fill="none"/><circle cx="42" cy="55" r="4" fill="#d9776a" opacity=".35"/><circle cx="78" cy="55" r="4" fill="#d9776a" opacity=".35"/>
  <ellipse class="mouth" cx="60" cy="59" rx="6" ry="2" fill="#5a1f1f"/></g></svg>`;
const KOFI = `<svg viewBox="0 0 120 170" aria-hidden="true"><ellipse cx="60" cy="165" rx="38" ry="5" fill="rgba(0,0,0,.15)"/><g class="body"><line x1="60" y1="14" x2="60" y2="28" stroke="#6b7a8c" stroke-width="3"/><circle class="ant" cx="60" cy="12" r="5" fill="#f5b83d"/>
  <rect x="30" y="26" width="60" height="50" rx="16" fill="#5b8def"/><rect x="37" y="33" width="46" height="34" rx="10" fill="#0e2236"/>
  <ellipse class="eye" cx="50" cy="47" rx="5" ry="6" fill="#7ee8ff"/><ellipse class="eye" cx="70" cy="47" rx="5" ry="6" fill="#7ee8ff"/><rect class="mouth" x="53" y="58" width="14" height="3" rx="1.5" fill="#7ee8ff"/>
  <rect x="52" y="76" width="16" height="8" fill="#9aa8ba"/><rect x="34" y="84" width="52" height="76" rx="14" fill="#dfe7f3" stroke="#b9c6d8"/><circle cx="60" cy="110" r="10" fill="#0b6e4f"/><circle class="ant" cx="60" cy="110" r="4" fill="#9ff0c8"/>
  <rect x="20" y="88" width="14" height="46" rx="7" fill="#9aa8ba"/><g class="arm"><rect x="86" y="88" width="14" height="46" rx="7" fill="#9aa8ba"/></g></g></svg>`;
let intro = null;
const seenKey = (cid, sid) => 'intro_' + cid + '_' + sid, seenMem = {};
function introSeen(cid, sid) { try { return !!localStorage.getItem(seenKey(cid, sid)); } catch (e) { return !!seenMem[seenKey(cid, sid)]; } }
function setSeen(cid, sid, v) { try { v ? localStorage.setItem(seenKey(cid, sid), '1') : localStorage.removeItem(seenKey(cid, sid)); } catch (e) { seenMem[seenKey(cid, sid)] = v; } }
function introHtml() {
  return `<div class="stage"><div class="chars"><div class="chw" id="chA">${AWA}<b>Awa</b></div><div class="chw" id="chK">${KOFI}<b>Kofi</b></div></div>
  <div class="bub l" id="bub" aria-live="polite"></div><div class="nav2"><button class="l" onclick="introEnd()">Passer l’introduction</button><button id="inx" onclick="introNext()">Suivant ▸</button></div></div>`;
}
/** Répliques : texte de l'administrateur (une par ligne ; « Awa: » ou « Kofi: » choisit qui parle) ou introduction automatique. */
function introLines(s) {
  const own = String(s.intro || '').split('\n').map(x => x.trim()).filter(Boolean), out = []; let last = 'K';
  const auto = [];
  if (!own.length) {
    const nd = s.documents.filter(d => !d.facultatif).length, q = s.quiz;
    auto.push('A:Bienvenue ' + (s.virtual ? 'dans l’introduction du cours !' : 'dans le module « ' + s.titre + ' » !'));

const tbl = (head, rows) => `<div style="overflow-x:auto"><table><tr>${head.map(x => `<th>${esc(x)}</th>`).join('')}</tr>${rows.map(r => `<tr>${r.map(c => `<td>${esc(c)}</td>`).join('')}</tr>`).join('')}</table></div>`;
const rptTable = r => tbl(['', '< 5 ans M', '< 5 ans F', '≥ 5 ans M', '≥ 5 ans F', 'Total'], r.map((l, i) => [['Suspects', 'Décès', 'Confirmés'][i]].concat(l)));
function chartSvg(t, d) {

  <div class="card"><h3>Documents hors module</h3><p class="mu">Les documents obligatoires déposés ici forment une introduction lue avant le module 1. Les ressources facultatives sont consultables par tous dès le pré-test passé.</p>
  ${dzone(id, '', false, '📌 Introduction (lecture obligatoire)', r.documents.filter(d => !d.sequence && !d.facultatif))}${dzone(id, '', true, '📎 Ressources générales (facultatives)', r.documents.filter(d => !d.sequence && d.facultatif))}
  <h4>Ajouter un lien</h4><select id="dsq"><option value="">Hors module</option>${r.sequences.map((x, i) => `<option value="${x.id}">Module ${i + 1} — ${esc(x.titre)}</option>`).join('')}</select><input id="dt" placeholder="Titre du document"><input id="du" placeholder="Lien (Drive, YouTube, site…)"><label class="o"><input type="checkbox" id="dfac"> Facultatif (pas de lecture obligatoire)</label><button onclick="addDoc('${id}')">Ajouter le lien</button></div>
  <div class="card"><h3>Questions (${r.questions.length})</h3><div style="max-height:220px;overflow:auto">${r.questions.map(q => row('Questions', q.id, `<span class="mu">${q.phase === 'Quiz' ? 'Quiz · ' + esc((r.sequences.filter(x => x.id === q.sequence)[0] || {}).titre || '?') : q.phase} · ${q.type}</span> ${esc(q.question).slice(0, 70)}`)).join('')}</div>
  <select id="qp"><option value="Pré-test">Pré-test</option><option value="Post-test">Post-test</option>${r.sequences.map(x => `<option value="Quiz:${x.id}">Quiz — ${esc(x.titre)}</option>`).join('')}</select><textarea id="qq" rows="2" placeholder="Question"></textarea><textarea id="qo" rows="4" placeholder="Un choix par ligne"></textarea>
  <input id="qb" placeholder="Numéros des bonnes réponses, ex. 2 ou 1,3"><textarea id="qe" rows="2" placeholder="Explication (affichée après le test)"></textarea><button onclick="addQ('${id}')">Ajouter la question</button></div>
  <div class="card"><h3>Importer des questions (fichier CSV)</h3><p class="mu">Colonnes : phase (Pré-test, Post-test ou Quiz), sequence (pour les quiz : numéro du module, 1 = première, ou son titre), type, question, options, bonnes, explication, donnees.</p>
  <input id="qf" type="file" accept=".csv,.txt"><label class="o"><input type="checkbox" id="qr"> Remplacer les questions déjà présentes pour les phases du fichier</label><button onclick="importQ('${id}')">Importer le fichier</button></div>
  <div class="card"><button class="l" onclick="delCourse('${id}')">Supprimer tout ce cours</button></div>
  <div class="card"><h3>Résultats (code de travail = pseudonyme)</h3><p class="mu">Cliquez sur une ligne pour voir, question par question, la réponse de l’utilisateur et la réponse correcte.</p>${r.resultats.length ? r.resultats.map(x => `<details style="border-bottom:1px solid var(--bd);padding:4px 0"><summary><b>${esc(x.pseudo)}</b> · ${x.phase === 'Quiz' ? 'Quiz — ' + esc((r.sequences.filter(q => q.id === x.sequence)[0] || {}).titre || '?') : x.phase} · ${x.score}/${x.total} <span class="mu">${new Date(x.date).toLocaleDateString('fr-FR')}</span></summary>${corrHtml(x.corrige) || '<p class="mu">Détail non enregistré (test passé avant la mise à jour).</p>'}</details>`).join('') : '<p class="mu">Aucun résultat.</p>'}</div>`);
}
function parseCSV(t) {
  t = t.replace(/^\uFEFF/, ''); const first = t.split('\n')[0];
  const d = [';', '\t', ','].map(c => [c, first.split(c).length]).sort((a, b) => b[1] - a[1])[0][0];
  const rows = []; let r = [], f = '', q = false;
  for (let i = 0; i < t.length; i++) { const c = t[i];
    if (q) { if (c === '"') { if (t[i + 1] === '"') { f += '"'; i++; } else q = false; } else f += c; }
    else if (c === '"') q = true; else if (c === d) { r.push(f); f = ''; }
    else if (c === '\n' || c === '\r') { if (c === '\r' && t[i + 1] === '\n') i++; r.push(f); f = ''; rows.push(r); r = []; } else f += c; }
  if (f || r.length) { r.push(f); rows.push(r); }
  const h = rows.shift().map(x => x.trim().toLowerCase());
  return rows.filter(x => x.some(y => y.trim())).map(x => Object.fromEntries(h.map((k, i) => [k, x[i] || ''])));
}
async function importQ(id) {
  const f = $('#qf').files[0]; if (!f) return alert('Choisissez un fichier CSV.');
  let lignes; try { lignes = parseCSV(await f.text()); } catch (e) { return alert('Fichier illisible.'); }
  const r = await api('adminImportQuestions', adminPw, id, lignes, $('#qr').checked); if (!r.ok) return alert(r.message);
  alert(r.ajoutees + ' question(s) importée(s).' + (r.erreurs.length ? '\n\nÀ corriger :\n' + r.erreurs.join('\n') : '')); adminCourse(id);
}
async function addBloc(id) { const r = await api('adminAddBloc', adminPw, id, $('#bt').value, $('#bx').value); r.ok ? adminCourse(id) : alert(r.message); }
const docRow = (d, id) => `<div class="msg" draggable="true" ondragstart="event.dataTransfer.setData('text/doc', '${d.id}')">⠿ 📄 ${esc(d.titre)} <button class="l" onclick="edit('Documents','${d.id}','${id}')">Modifier</button><button class="l" onclick="del('Documents','${d.id}','${id}')">Supprimer</button></div>`;
const dzone = (id, sid, fac, titre, list) => `<div class="dz" ondragover="event.preventDefault();this.classList.add('over')" ondragleave="this.classList.remove('over')" ondrop="dzDrop(event,'${id}','${sid}',${fac})">
  <b>${titre}</b>${list.map(d => docRow(d, id)).join('') || '<p class="mu">Aucun document.</p>'}
  <p class="mu">Déposez des fichiers ici, ou <label class="lk">choisissez-les<input type="file" multiple hidden onchange="uploadFiles('${id}','${sid}',${fac},this.files)"></label>.</p><div class="mu" id="up_${sid || 'x'}_${fac ? 1 : 0}"></div></div>`;
async function dzDrop(e, id, sid, fac) {
  e.preventDefault(); e.currentTarget.classList.remove('over');
  const files = e.dataTransfer.files, did = e.dataTransfer.getData('text/doc');
  if (files && files.length) return uploadFiles(id, sid, fac, files);
  const g = did && admDet.documents.filter(x => x.id === did)[0]; if (!g || (!!g.facultatif === fac && (g.sequence || '') === sid)) return;
  const r = await api('adminUpdate', adminPw, 'Documents', did, { facultatif: fac, sequence: sid }); r.ok ? adminCourse(id) : alert(r.message);
}
/** Envoie plusieurs fichiers, l'un après l'autre, dans le module et la catégorie choisies (fac = facultatif). */
async function uploadFiles(id, sid, fac, list) {
  const files = [...list], log = $('#up_' + (sid || 'x') + '_' + (fac ? 1 : 0)), bad = []; let ok = 0;
  for (let i = 0; i < files.length; i++) {
    const f = files[i]; log.textContent = `Envoi ${i + 1}/${files.length} : ${f.name}…`;
    if (f.size > 25 * 1024 * 1024) { bad.push(f.name + ' : plus de 25 Mo'); continue; }
    const b64 = await new Promise(res => { const x = new FileReader(); x.onload = () => res(x.result.split(',')[1]); x.readAsDataURL(f); });
    const r = await api('adminAddDoc', adminPw, id, { titre: f.name.replace(/\.[^.]+$/, ''), facultatif: fac, sequence: sid, fichier: { nom: f.name, mime: f.type || 'application/octet-stream', b64 } });
    r.ok ? ok++ : bad.push(f.name + ' : ' + r.message);
  }
  if (bad.length) alert(ok + ' document(s) ajouté(s).\n\nNon ajoutés :\n' + bad.join('\n'));
  adminCourse(id);
}
async function addSeq(id) { const r = await api('adminSaveSequence', adminPw, id, { titre: $('#sn').value }); r.ok ? adminCourse(id) : alert(r.message); }
async function renameSeq(id, sid) { const g = admDet.sequences.filter(x => x.id === sid)[0], t = prompt('Titre du module :', g.titre); if (t === null) return; const r = await api('adminSaveSequence', adminPw, id, { id: sid, titre: t }); r.ok ? adminCourse(id) : alert(r.message); }
async function saveIntro(id, sid) { const g = admDet.sequences.filter(x => x.id === sid)[0], r = await api('adminSaveSequence', adminPw, id, { id: sid, titre: g.titre, intro: $('#si_' + sid).value }); r.ok ? (alert('Introduction enregistrée.'), adminCourse(id)) : alert(r.message); }
async function moveSeq(id, sid, d) { await api('adminMoveSequence', adminPw, id, sid, d); adminCourse(id); }
async function delSeq(id, sid) {
  if (!confirm('Supprimer ce module DÉFINITIVEMENT, avec ses documents, les questions de son quiz et les résultats de ce quiz ?')) return;
  const r = await api('adminDeleteSequence', adminPw, id, sid); r.ok ? adminCourse(id) : alert(r.message);
}
async function addDoc(id) {
  const r = await api('adminAddDoc', adminPw, id, { titre: $('#dt').value, url: $('#du').value, facultatif: $('#dfac').checked, sequence: $('#dsq').value }); r.ok ? adminCourse(id) : alert(r.message);
}
async function addQ(id) {
  const pv = $('#qp').value.split(':'), q = { phase: pv[0], sequence: pv[1] || '', question: $('#qq').value, options: $('#qo').value.split('\n'), explication: $('#qe').value,
    bonnes: $('#qb').value.split(/[,;\s]+/).filter(Boolean).map(n => n - 1) };
  const r = await api('adminAddQuestion', adminPw, id, q); r.ok ? adminCourse(id) : alert(r.message);
}

/* ---------- Application installable (PWA) ---------- */
let evInstall = null;
const standalone = matchMedia('(display-mode: standalone)').matches || navigator.standalone;
const ios = /iphone|ipad|ipod/i.test(navigator.userAgent);
if (!standalone) {
  if (ios) $('#inst').style.display = '';
  window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); evInstall = e; $('#inst').style.display = ''; });
}
async function installApp() {
  if (evInstall) { evInstall.prompt(); await evInstall.userChoice; evInstall = null; $('#inst').style.display = 'none'; }
  else alert('Sur iPhone : touchez le bouton Partager de Safari, puis « Sur l’écran d’accueil ».');
}
window.addEventListener('appinstalled', () => { $('#inst').style.display = 'none'; });
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});

tok ? home() : auth();
</script>
