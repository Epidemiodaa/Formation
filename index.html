<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Plateforme de formation</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0b6e4f">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Formation">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{--bg:#f6f7f9;--card:#fff;--tx:#1d2733;--mu:#64707d;--pr:#0b6e4f;--bd:#dde2e8;--er:#b3261e}
@media(prefers-color-scheme:dark){:root{--bg:#14181d;--card:#1d242c;--tx:#e8ecf0;--mu:#9aa6b2;--pr:#3cc28f;--bd:#2f3943;--er:#f2827b}}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
*{box-sizing:border-box}body{margin:0;min-height:100vh;min-height:100dvh;overflow-wrap:anywhere;font:16px/1.5 system-ui,sans-serif;background:var(--bg);color:var(--tx)}
header{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:4px;padding:12px max(16px,env(safe-area-inset-right)) 12px max(16px,env(safe-area-inset-left));padding-top:max(12px,env(safe-area-inset-top));z-index:5;background:var(--card);border-bottom:1px solid var(--bd);position:sticky;top:0}
header b{color:var(--pr)}main{max-width:760px;margin:0 auto;padding:16px max(16px,env(safe-area-inset-right)) max(16px,env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left))}
img,svg,video,iframe{max-width:100%}
/* Tablette / rotation : la mise en page suit l'orientation (portrait, paysage, tous les sens) */
@media(min-width:900px){main{max-width:1000px}.chw{width:140px}#app>.card,#app>h2,#app>h3{max-width:100%}}
@media(min-width:900px) and (orientation:landscape){.tabs button,.steps button{padding:9px 16px}}
@media(max-height:520px) and (orientation:landscape){.chw{width:78px}.stage{padding:8px}.bub{margin:10px 0 6px}header{position:static}}
.card{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:14px;margin:10px 0}
button,input,textarea,select{font:inherit;color:inherit}
button{background:var(--pr);color:#fff;border:0;border-radius:8px;padding:8px 14px;cursor:pointer}
button.s{background:none;color:var(--pr);border:1px solid var(--pr)}button.l{background:none;color:var(--mu);padding:4px 8px}
input,textarea,select{width:100%;padding:8px;margin:4px 0 10px;border:1px solid var(--bd);border-radius:8px;background:var(--bg)}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0}.tabs button{background:none;color:var(--tx);border:1px solid var(--bd)}.tabs button.on{background:var(--pr);color:#fff}
.mu{color:var(--mu);font-size:.9em}.er{color:var(--er)}.ok{color:var(--pr)}
.msg{padding:6px 0;border-bottom:1px solid var(--bd)}.msg.me{background:rgba(11,110,79,.07)}
table{border-collapse:collapse;font-size:.9em;margin:6px 0}th,td{border:1px solid var(--bd);padding:3px 7px;text-align:center}select{width:auto;max-width:100%;margin:4px 4px 4px 0}
.dz{border:2px dashed var(--bd);border-radius:10px;padding:10px;margin:10px 0}.dz.over{border-color:var(--pr);background:rgba(11,110,79,.08)}.dz .msg[draggable=true]{cursor:grab}.lk{color:var(--pr);text-decoration:underline;cursor:pointer}
/* Image de couverture des cours + notifications */
.card.hc{overflow:hidden}.cov{position:relative;aspect-ratio:16/7;background:#0b6e4f;cursor:pointer;margin:-14px -14px 10px;overflow:hidden}.cov.big{margin:0 0 10px;border-radius:10px;cursor:default;aspect-ratio:16/6}
.cov img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .3s}.cov:hover img{transform:scale(1.03)}.cov.big:hover img{transform:none}
.cov .cap{position:absolute;left:0;right:0;bottom:0;padding:28px 14px 10px;color:#fff;background:linear-gradient(transparent,rgba(0,0,0,.72))}.cov .cap h2,.cov .cap b{margin:0;color:#fff;font-size:1.15em}
.tag{display:inline-block;background:#f5b83d;color:#3a2a00;border-radius:999px;font-size:.75em;font-weight:700;padding:1px 8px;margin-left:6px;vertical-align:middle}
.bdg{display:inline-block;background:var(--er);color:#fff;border-radius:999px;font-size:.75em;padding:0 7px;margin-left:4px}
#toast{position:fixed;left:50%;transform:translateX(-50%);top:max(10px,env(safe-area-inset-top));z-index:30;width:min(92vw,420px);display:flex;flex-direction:column;gap:8px}
#toast div{background:var(--card);border:1px solid var(--pr);border-left-width:5px;border-radius:10px;padding:10px 12px;box-shadow:0 6px 20px rgba(0,0,0,.25);cursor:pointer}
/* Parcours du cours : cartes de modules avec photo */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px;margin:10px 0}.grid .card{margin:0}
.mcard{cursor:pointer;transition:transform .15s}.mcard:hover{transform:translateY(-2px)}.mcard.mlk{cursor:not-allowed}.mcard.mlk:hover{transform:none}.mcard.mlk .cov img{filter:grayscale(1)}
.cov.ph{background:linear-gradient(135deg,#0b6e4f,#2a9d78);display:flex;align-items:center;justify-content:center}.cov.ph>span{font-size:2.6em;color:#fff;font-weight:700}
.lkm{position:absolute;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;font-size:2em}
/* Lecteur intégré : vidéos, documents Word/PDF/PowerPoint, leçons HTML */
.vw{margin:8px 0}.vw iframe,.vw video{width:100%;border:0;border-radius:8px;background:#000}.vw iframe.vid,.vw video{aspect-ratio:16/9}.vw iframe.tall{height:70vh;background:#fff}.vw iframe.page{height:75vh;background:#fff}.vw img{border-radius:8px}
/* Personnages animés (introduction des modules) */
.stage{background:linear-gradient(#e6f5ee,var(--card));border:1px solid var(--bd);border-radius:12px;padding:12px;margin:10px 0}
.chars{display:flex;justify-content:space-around;align-items:flex-end}
.chw{width:112px;text-align:center;transition:opacity .3s,transform .3s}.chw.idle{opacity:.55;transform:scale(.93)}.chw b{font-size:.85em;color:var(--mu)}
.chw svg{width:100%;height:auto;display:block}
.chw .body{animation:bob 3s ease-in-out infinite}.chw .eye,.chw .mouth,.chw .ant,.chw .arm{transform-box:fill-box}
.chw .eye{transform-origin:center;animation:blink 4.5s infinite}.chw .ant{transform-origin:center;animation:pulse 1.6s ease-in-out infinite}
.chw .mouth{transform-origin:center}.chw.talk .mouth{animation:talk .22s ease-in-out infinite alternate}
.chw .arm{transform-origin:50% 0}.chw.hello .arm{animation:wave .7s ease-in-out infinite alternate}
@keyframes bob{50%{transform:translateY(-4px)}}@keyframes blink{0%,93%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}
@keyframes pulse{50%{transform:scale(1.35);opacity:.7}}@keyframes talk{to{transform:scaleY(2.6)}}@keyframes wave{from{transform:rotate(-8deg)}to{transform:rotate(-55deg)}}
.bub{position:relative;background:var(--card);border:2px solid var(--pr);border-radius:14px;padding:10px 12px;margin:14px 0 8px;min-height:3.4em}
.bub::before{content:"";position:absolute;top:-10px;width:16px;height:16px;background:var(--card);border-left:2px solid var(--pr);border-top:2px solid var(--pr);transform:rotate(45deg)}
.bub.l::before{left:20%}.bub.r::before{right:20%}
.steps{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0}.steps button{background:none;color:var(--tx);border:1px solid var(--bd);padding:6px 11px}.steps button.on{background:var(--pr);color:#fff;border-color:var(--pr)}.steps button.ok2{border-color:var(--pr);color:var(--pr)}.steps button.on.ok2{color:#fff}.steps button:disabled{opacity:.45;cursor:not-allowed}
.nav2{display:flex;justify-content:space-between;gap:8px;margin:14px 0;flex-wrap:wrap}.nav2 button:disabled{opacity:.45;cursor:not-allowed}
@media(prefers-reduced-motion:reduce){.chw *{animation:none!important}}
label.o{display:block;padding:6px 8px;border:1px solid var(--bd);border-radius:8px;margin:4px 0;cursor:pointer}label.o input{width:auto;margin:0 8px 0 0}
</style>
</head>
<body>
<header><b>Plateforme de formation</b><span><button id="inst" class="s" style="display:none" onclick="installApp()">📲 Installer</button><span id="nav"></span></span></header>
<main id="app"></main><div id="toast" aria-live="polite"></div>
<script>
// >>> Coller ici l'URL /exec du déploiement Apps Script <<<
const API_URL = 'https://script.google.com/macros/s/AKfycbzmylSAU7ocsFHMVDGNaO2jladI_obqWVw8m-4pkVr4R1gVxmZU8kRQjwqSfczdIVEE/exec';
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let tmr = null, typ = null, chatOpen = null, unread = {}, since = Number(localStorage.getItem('since')) || 0, pollT = null;
let tok = localStorage.getItem('tok'), pseudo = localStorage.getItem('pseudo'), adminPw = null, timer = null, cur = null;

async function api(action, ...args) {
  if (!/^https:\/\/script\.google(usercontent)?\.com\//.test(API_URL))
    return { ok: false, message: 'Adresse du serveur non configurée : remplacez COLLER_ICI_URL_EXEC au début du script de index.html par l’URL /exec de votre déploiement Apps Script.' };
  let res;
  try { res = await fetch(API_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ action, args }) }); }
  catch (e) { return { ok: false, message: 'Pas de connexion au serveur. Vérifiez internet, puis que le déploiement Apps Script est « Exécuter en tant que : moi » et « Accès : tout le monde ».' }; }
  const txt = await res.text();
  try { return JSON.parse(txt); }
  catch (e) { return { ok: false, message: 'Le serveur a répondu autre chose que des données (autorisation ou déploiement à refaire : exécutez setup() dans Apps Script, puis redéployez en « Nouvelle version »).' }; }
}
function view(html) { chatOpen = null; clearInterval(timer); clearInterval(tmr); clearInterval(typ); $('#app').innerHTML = html; window.scrollTo(0, 0); }
function nav() {
  $('#nav').innerHTML = tok ? `${'Notification' in window && Notification.permission !== 'granted' && Notification.permission !== 'denied' ? '<button class="l" onclick="askNotif()" title="Être prévenu des nouveaux messages et cours">🔔 Activer les alertes</button>' : ''}<button class="l" onclick="home()">Mes cours</button><button class="l" onclick="profile()">${esc(pseudo)}</button><button class="l" onclick="logout()">Quitter</button>` : `<button class="l" onclick="admin()">Admin</button>`;
}
function setSession(r) { tok = r.token; pseudo = r.pseudo; localStorage.setItem('tok', tok); localStorage.setItem('pseudo', pseudo); startPolling(); }
function logout() { tok = null; stopPolling(); localStorage.clear(); auth(); }
function fail(r) { if (/Session expirée/.test(r.message || '')) return logout(); alert(r.message || 'Erreur'); }

/* ---------- Connexion / inscription ---------- */
function auth(msg) {
  nav();
  view(`<div class="card"><h2>Bienvenue</h2><p class="mu">Première visite ? Choisissez un pseudonyme et un mot de passe : votre compte est créé tout de suite, sans validation.</p>
  <input id="p" placeholder="Pseudonyme (3 à 30 caractères, sans espace)" autocapitalize="off"><input id="w" type="password" placeholder="Mot de passe (6 caractères minimum)">
  <p class="er" id="m">${esc(msg || '')}</p><button onclick="doAuth()">Continuer</button></div>`);
}
async function doAuth() {
  const r = await api('login', $('#p').value, $('#w').value);
  if (!r.ok) return ($('#m').textContent = r.message);
  setSession(r); if (r.created) alert('Compte créé. Bienvenue !'); home();
}

/* ---------- Accueil : mes cours + catalogue ---------- */
async function home() {
  if (!tok) return auth(); nav(); view('<p class="mu">Chargement…</p>');
  const r = await api('me', tok); if (!r.ok) return fail(r);
  const cover = c => c.image ? `<div class="cov" role="button" tabindex="0" title="${c.inscrit ? 'Ouvrir le cours' : 'S’inscrire et ouvrir le cours'}" onclick="${c.inscrit ? `openCourse('${c.id}')` : `join('${c.id}')`}"><img src="${esc(c.image)}" alt="" loading="lazy"><div class="cap"><b>${esc(c.titre)}</b>${c.nouveau ? '<span class="tag">Nouveau</span>' : ''}</div></div>` : '';
  const item = c => `<div class="card ${c.image ? 'hc' : ''}">${cover(c)}${c.image ? '' : `<b>${esc(c.titre)}</b>${c.nouveau ? '<span class="tag">Nouveau</span>' : ''}`}<p class="mu">${esc(c.description)}</p>${c.inscrit
    ? `<button data-open="${c.id}" onclick="openCourse('${c.id}')">Ouvrir${unread[c.id] ? `<span class="bdg">💬 ${unread[c.id]}</span>` : ''}</button> <button class="l" onclick="leave('${c.id}')">Me désinscrire</button>`
    : `<button class="s" onclick="join('${c.id}')">S’inscrire</button>`}</div>`;
  const mine = r.cours.filter(c => c.inscrit), other = r.cours.filter(c => !c.inscrit);
  view(`<h2 data-home>Mes cours</h2>${mine.map(item).join('') || '<p class="mu">Vous n’êtes inscrit à aucun cours.</p>'}<h2>Cours disponibles</h2>${other.map(item).join('') || '<p class="mu">Aucun autre cours.</p>'}`);
}
async function join(id) { const r = await api('enroll', tok, id); r.ok ? openCourse(id) : fail(r); }
async function leave(id) { if (confirm('Se désinscrire de ce cours ?')) { await api('unenroll', tok, id); home(); } }

/* ---------- Profil ---------- */
async function profile() {
  view('<p class="mu">Chargement…</p>');
  const r = await api('profil', tok); if (!r.ok) return fail(r);
  view(`<div class="card"><h2>Mon profil</h2><p class="mu">Compte créé le ${new Date(r.cree).toLocaleDateString('fr-FR')}</p>
  <label>Pseudonyme</label><input id="np" value="${esc(r.pseudo)}" autocapitalize="off">
  <label>Nouveau mot de passe (laisser vide pour ne pas changer)</label><input id="nw" type="password" placeholder="6 caractères minimum">
  <p id="m" class="er"></p><button onclick="saveProfile()">Enregistrer</button></div>
  <h3>Mes cours et résultats</h3>${r.cours.map(c => `<div class="card"><b>${esc(c.titre)}</b><p class="mu">Pré-test : ${c.pre || 'non passé'} · Post-test : ${c.post || 'non passé'}</p><button class="s" onclick="openCourse('${c.id}')">Ouvrir</button></div>`).join('') || '<p class="mu">Aucune inscription.</p>'}`);
}
async function saveProfile() {
  const r = await api('updateProfile', tok, $('#np').value, $('#nw').value);
  if (!r.ok) return ($('#m').className = 'er', $('#m').textContent = r.message);
  pseudo = r.pseudo; localStorage.setItem('pseudo', pseudo); nav(); $('#nw').value = ''; $('#m').className = 'ok'; $('#m').textContent = 'Enregistré.';
}

/* ---------- Page d'un cours ---------- */
async function openCourse(id, tab) {
  view('<p class="mu">Chargement…</p>');
  const r = await api('course', tok, id); if (!r.ok) { fail(r); return home(); }
  if (!tab) modIdx = null;
  cur = r; tab = tab || (r.verrous.docs ? 'Pré-test' : 'docs');
  const T = [['docs', 'Cours'], ['Pré-test', 'Pré-test'], ['Post-test', 'Post-test'], ['chat', 'Discussion']], base = tab.indexOf('quiz:') === 0 ? 'docs' : tab;
  view(`${r.image ? `<div class="cov big"><img src="${esc(r.image)}" alt=""><div class="cap"><h2>${esc(r.titre)}</h2></div></div>` : `<h2>${esc(r.titre)}</h2>`}<p class="mu">${esc(r.description)}</p>
  <div class="tabs">${T.map(t => `<button class="${t[0] === base ? 'on' : ''}" onclick="${t[0] === 'docs' ? 'modIdx = null;' : ''}openCourse('${id}','${t[0]}')">${lockOf(t[0]) ? '🔒 ' : ''}${t[1]}${t[0] === 'chat' && unread[id] ? `<span class="bdg" id="chatbdg">${unread[id]}</span>` : ''}</button>`).join('')}</div><div id="tab"></div>`);
  if (tab === 'docs') docsTab(id);
  else if (base !== tab) quizHome(id, tab.slice(5));
  else if (tab === 'chat') chat(id);
  else testHome(id, tab);
}

/* ---------- Cours : modules (documents à lire, puis quiz) ---------- */
// Ordre : pré-test (sauf s'il est facultatif) → modules dans l'ordre (documents lus et marqués, puis quiz réussi) → post-test. Le serveur applique les mêmes règles.
const lockOf = t => t === 'docs' ? cur.verrous.docs : t === 'Post-test' ? cur.verrous.post && !cur.resultats['Post-test'] : false;
let modIdx = null;
const KIND = { video: '🎬', word: '📝', pdf: '📕', ppt: '📊', excel: '📈', image: '🖼️', page: '🎭', lien: '🔗' };
/** Lecteur intégré possible ? (YouTube, Vimeo, fichiers Drive, Google Docs, vidéo directe, image, leçon HTML) */
function embedOf(d) {
  if (d.type === 'page') return { page: true };
  const u = d.url || ''; let m;
  if ((m = /(?:youtube\.com\/watch\?(?:[^#]*&)?v=|youtu\.be\/|youtube\.com\/embed\/|youtube\.com\/shorts\/)([\w-]{11})/.exec(u))) return { src: 'https://www.youtube.com/embed/' + m[1] };
  if ((m = /vimeo\.com\/(?:video\/)?(\d+)/.exec(u))) return { src: 'https://player.vimeo.com/video/' + m[1] };
  if ((m = /drive\.google\.com\/file\/d\/([\w-]+)/.exec(u))) return { src: 'https://drive.google.com/file/d/' + m[1] + '/preview' };
  if ((m = /docs\.google\.com\/(document|presentation|spreadsheets)\/d\/([\w-]+)/.exec(u))) return { src: 'https://docs.google.com/' + m[1] + '/d/' + m[2] + '/preview' };
  if (/^https:\/\/.+\.(mp4|webm|ogg|m4v)(\?|$)/i.test(u)) return { video: u };
  if (/^https:\/\/.+\.(png|jpe?g|gif|webp)(\?|$)/i.test(u)) return { img: u };
  return null;
}
function docCard(id, d) {
  const e = embedOf(d), ic = KIND[d.type] || '🔗';
  const title = d.type === 'page' ? `<b>${esc(d.titre)}</b>` : `<a href="${esc(d.url)}" target="_blank" rel="noopener" ${d.facultatif ? '' : `onclick="docOpened('${id}','${d.id}')"`}>${esc(d.titre)}</a>`;
  const lab = d.type === 'page' ? '▶ Ouvrir la leçon' : d.type === 'video' ? '▶ Voir la vidéo' : '👁 Lire ici';
  return `<div class="card">${ic} ${title} ${e ? `<button class="s" onclick="viewDoc('${id}','${d.id}')">${lab}</button>` : ''}<div id="vw_${d.id}"></div>${d.facultatif ? '' : `
      <div id="dz_${d.id}">${docState(id, d)}</div>`}</div>`;
}
/** Affiche / masque le document dans la page : le lire ici compte comme « ouvert ». Les leçons HTML tournent dans un cadre isolé (aucun accès à la session). */
async function viewDoc(cid, did) {
  const d = findDoc(did), box = $('#vw_' + did); if (!d || !box) return;
  if (box.firstChild) { box.innerHTML = ''; box.className = ''; return; }
  docOpened(cid, did);
  const e = embedOf(d); let el;
  if (d.type === 'page') {
    box.innerHTML = '<p class="mu">Chargement…</p>';
    const r = await api('getPage', tok, cid, did); box.innerHTML = ''; if (!r.ok) return alert(r.message);
    el = document.createElement('iframe'); el.setAttribute('sandbox', 'allow-scripts allow-popups'); el.className = 'page'; el.srcdoc = r.html;
  } else if (e && e.src) {
    el = document.createElement('iframe'); el.setAttribute('sandbox', 'allow-scripts allow-same-origin allow-presentation allow-popups'); el.allow = 'fullscreen'; el.allowFullscreen = true;
    el.className = d.type === 'video' ? 'vid' : 'tall'; el.src = e.src;
  } else if (e && e.video) { el = document.createElement('video'); el.controls = true; el.src = e.video; }
  else if (e && e.img) { el = document.createElement('img'); el.src = e.img; el.alt = d.titre; }
  else return;
  box.className = 'vw'; box.appendChild(el);
  if (el.requestFullscreen) { const b = document.createElement('button'); b.className = 'l'; b.textContent = '⛶ Plein écran'; b.onclick = () => el.requestFullscreen(); box.appendChild(b); }
}
const stepsOf = () => cur.sequences.map(s => ({ s })).concat(cur.ressources.length ? [{ res: true }] : []);
function moduleBody(id, s, n) {
  const req = s.documents.filter(d => !d.facultatif), opt = s.documents.filter(d => d.facultatif), q = s.quiz;
  return `<div class="card"><h3>${s.virtual ? '' : 'Module ' + n + ' — '}${esc(s.titre)} ${s.complete ? '<span class="ok">✔ terminé</span>' : ''}</h3>
    ${req.length ? `<p class="mu">Documents lus : <b>${s.lus} / ${s.total}</b></p>` : ''}<button class="l" onclick="replayIntro('${id}','${s.id}')">▶ Revoir l’introduction</button></div>`
    + req.map(d => docCard(id, d)).join('')
    + (opt.length ? '<p class="mu">Ressources complémentaires de ce module (facultatives, non liées au cours) :</p>' + opt.map(d => docCard(id, d)).join('') : '')
    + (q ? `<div class="card"><b>📝 Quiz du module</b> <span class="mu">(${q.n} question${q.n > 1 ? 's' : ''}${q.seuil > 0 ? ' · réussite à partir de ' + q.seuil + ' %' : ''})</span>`
      + (q.reussi ? `<p class="ok">✔ Quiz réussi : ${q.meilleur.score} / ${q.meilleur.total}</p><button class="s" onclick="openCourse('${id}','quiz:${s.id}')">Revoir ma correction</button>`
        : !s.lu ? '<p class="mu">🔒 Le quiz s’ouvre quand tous les documents obligatoires de ce module sont marqués comme lus.</p>'
        : q.essais ? `<p class="er">Dernier essai : ${q.dernier.score} / ${q.dernier.total} — il faut ${q.seuil} % pour passer au module suivant.</p><button onclick="openCourse('${id}','quiz:${s.id}')">Voir la correction et réessayer</button>`
        : `<p class="mu">Tous les documents sont lus : le quiz est ouvert.${q.seuil > 0 ? ' Il faut le réussir pour débloquer le module suivant.' : ''}</p><button onclick="openCourse('${id}','quiz:${s.id}')">Passer le quiz</button>`) + '</div>' : '');
}
/** Parcours du cours : pré-test (facultatif ou non) → modules (photo + titre ; un clic ouvre le module) → évaluation finale. */
function overviewHtml(id) {
  const st = stepsOf(), V = cur.verrous; let n = 0, cs = [];

function introLines(s) {

function parseCSV(t) {
  t = t.replace(/^\uFEFF/, ''); const first = t.split('\n')[0];
  const d = [';', '\t', ','].map(c => [c, first.split(c).length]).sort((a, b) => b[1] - a[1])[0][0];
  const rows = []; let r = [], f = '', q = false;
  for (let i = 0; i < t.length; i++) { const c = t[i];
    if (q) { if (c === '"') { if (t[i + 1] === '"') { f += '"'; i++; } else q = false; } else f += c; }
    else if (c === '"') q = true; else if (c === d) { r.push(f); f = ''; }
    else if (c === '\n' || c === '\r') { if (c === '\r' && t[i + 1] === '\n') i++; r.push(f); f = ''; rows.push(r); r = []; } else f += c; }
  if (f || r.length) { r.push(f); rows.push(r); }
  const h = rows.shift().map(x => x.trim().toLowerCase());
  return rows.filter(x => x.some(y => y.trim())).map(x => Object.fromEntries(h.map((k, i) => [k, x[i] || ''])));
}

  for (let i = 0; i < files.length; i++) {
    const f = files[i]; log.textContent = `Envoi ${i + 1}/${files.length} : ${f.name}…`;
    if (f.size > 25 * 1024 * 1024) { bad.push(f.name + ' : plus de 25 Mo'); continue; }
    const b64 = await new Promise(res => { const x = new FileReader(); x.onload = () => res(x.result.split(',')[1]); x.readAsDataURL(f); });
    const r = await api('adminAddDoc', adminPw, id, { titre: f.name.replace(/\.[^.]+$/, ''), facultatif: fac, sequence: sid, fichier: { nom: f.name, mime: f.type || 'application/octet-stream', b64 } });
    r.ok ? ok++ : bad.push(f.name + ' : ' + r.message);
  }
  if (bad.length) alert(ok + ' document(s) ajouté(s).\n\nNon ajoutés :\n' + bad.join('\n'));
  adminCourse(id);
}

async function renameSeq(id, sid) { const g = admDet.sequences.filter(x => x.id === sid)[0], t = prompt('Titre du module :', g.titre); if (t === null) return; const r = await api('adminSaveSequence', adminPw, id, { id: sid, titre: t }); r.ok ? adminCourse(id) : alert(r.message); }
/** Réduit l'image (1000 px max, JPEG) avant l'envoi : plus rapide et dans les limites d'Apps Script. */
function resizeImg(file, max) {
  return new Promise((ok, ko) => { const img = new Image(), u = URL.createObjectURL(file);
    img.onload = () => { const k = Math.min(1, max / Math.max(img.width, img.height)), c = document.createElement('canvas'); c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height); URL.revokeObjectURL(u); ok(c.toDataURL('image/jpeg', .82).split(',')[1]); };
    img.onerror = () => ko(new Error('Image illisible.')); img.src = u; });
}
async function saveImage(id, remove) {
  const f = $('#cimg').files[0], url = $('#cimu').value.trim(); let img;
  if (remove) img = { url: '' }; else if (f) { try { img = { fichier: { nom: f.name.replace(/\.[^.]+$/, '') + '.jpg', mime: 'image/jpeg', b64: await resizeImg(f, 1000) } }; } catch (e) { return alert(e.message); } }
  else if (url) img = { url }; else return alert('Choisissez une image ou collez un lien.');
  const r = await api('adminSetCourseImage', adminPw, id, img); r.ok ? adminCourse(id) : alert(r.message);
}

  const r = await api('adminSetModuleImage', adminPw, id, sid, img); r.ok ? adminCourse(id) : alert(r.message);
}

/* ---------- Notifications : nouveaux messages et nouveaux cours ---------- */
// La page interroge le serveur toutes les 30 s (2 min si elle est en arrière-plan). Alerte dans l'application, et notification du système si l'utilisateur les a autorisées.
// Limite : sans serveur de « push », rien n'arrive quand l'application est complètement fermée.
function toast(html, go) {
  const t = $('#toast'), d = document.createElement('div'); d.innerHTML = html; d.onclick = () => { d.remove(); go && go(); }; t.appendChild(d); setTimeout(() => d.remove(), 7000);
}
async function askNotif() {
  if (!('Notification' in window)) return alert('Les notifications ne sont pas disponibles sur cet appareil.');
  const p = await Notification.requestPermission(); nav();
  if (p === 'granted') sysNotif('Alertes activées', 'Vous serez prévenu des nouveaux messages et des nouveaux cours.', {});
}
async function sysNotif(title, body, data) {
  if (!('Notification' in window) || Notification.permission !== 'granted') return;
  try { const reg = await navigator.serviceWorker.ready; reg.showNotification(title, { body, icon: 'icon-192.png', badge: 'icon-192.png', tag: data.cid ? 'c-' + data.cid + (data.tab || '') : 'n', renotify: true, data }); }
  catch (e) { try { new Notification(title, { body, icon: 'icon-192.png' }); } catch (x) { } }
}
function openFromNotif(d) { if (!tok) return; d && d.cid ? openCourse(d.cid, d.tab || 'docs') : home(); }
function refreshBadges() {
  document.querySelectorAll('[data-open]').forEach(b => { const n = unread[b.dataset.open]; b.innerHTML = 'Ouvrir' + (n ? `<span class="bdg">💬 ${n}</span>` : ''); });
  const t = [...document.querySelectorAll('.tabs button')].filter(x => /^(🔒 )?Discussion/.test(x.textContent))[0];
  if (t && cur && unread[cur.id]) t.innerHTML = `Discussion<span class="bdg">${unread[cur.id]}</span>`;
}
async function poll() {
  if (!tok) return;
  if (!since) { since = Date.now(); try { localStorage.setItem('since', since); } catch (e) { } return; }  // première fois : pas d'historique à signaler
  const r = await api('notifs', tok, since); if (!r.ok) return;
  since = r.now; try { localStorage.setItem('since', since); } catch (e) { }
  r.messages.forEach(m => {
    const watching = chatOpen === m.cours && !document.hidden; if (watching) return;   // la discussion ouverte se met à jour toute seule
    unread[m.cours] = (unread[m.cours] || 0) + 1;
    const go = () => openCourse(m.cours, 'chat'), t = '💬 ' + m.pseudo + ' · ' + m.titreCours;
    document.hidden ? sysNotif(t, m.texte, { cid: m.cours, tab: 'chat' }) : toast(`<b>${esc(t)}</b><br>${esc(m.texte)}`, go);
  });
  r.cours.forEach(c => {
    const go = () => home(), t = '🆕 Nouveau cours : ' + c.titre;
    document.hidden ? sysNotif(t, c.description || 'Un nouveau cours est disponible.', {}) : toast(`<b>${esc(t)}</b><br>${esc(c.description)}`, go);
  });
  if (r.messages.length) refreshBadges();
  if (r.cours.length && document.querySelector('[data-home]')) home();
}
function startPolling() { stopPolling(); if (!tok) return; const loop = async () => { await poll(); pollT = setTimeout(loop, document.hidden ? 120000 : 30000); }; loop(); }
function stopPolling() { clearTimeout(pollT); pollT = null; since = 0; }
document.addEventListener('visibilitychange', () => { if (!document.hidden && tok) { clearTimeout(pollT); startPolling(); } });
if ('serviceWorker' in navigator) navigator.serviceWorker.addEventListener('message', e => e.data && e.data.open && openFromNotif(e.data.open));

/* ---------- Application installable (PWA) ---------- */
let evInstall = null;
const standalone = matchMedia('(display-mode: standalone)').matches || navigator.standalone;
const ios = /iphone|ipad|ipod/i.test(navigator.userAgent);
if (!standalone) {
  if (ios) $('#inst').style.display = '';
  window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); evInstall = e; $('#inst').style.display = ''; });
}
async function installApp() {
  if (evInstall) { evInstall.prompt(); await evInstall.userChoice; evInstall = null; $('#inst').style.display = 'none'; }
  else alert('Sur iPhone : touchez le bouton Partager de Safari, puis « Sur l’écran d’accueil ».');
}
window.addEventListener('appinstalled', () => { $('#inst').style.display = 'none'; });
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});

tok ? (home(), startPolling()) : auth();
try { const h = decodeURIComponent(location.hash.slice(1)); if (h[0] === '{') { history.replaceState(null, '', location.pathname); setTimeout(() => openFromNotif(JSON.parse(h)), 800); } } catch (e) { }
