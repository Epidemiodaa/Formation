<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Plateforme de formation</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0b6e4f">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Formation">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{--bg:#f6f7f9;--card:#fff;--tx:#1d2733;--mu:#64707d;--pr:#0b6e4f;--bd:#dde2e8;--er:#b3261e}
@media(prefers-color-scheme:dark){:root{--bg:#14181d;--card:#1d242c;--tx:#e8ecf0;--mu:#9aa6b2;--pr:#3cc28f;--bd:#2f3943;--er:#f2827b}}
*{box-sizing:border-box}body{margin:0;font:16px/1.5 system-ui,sans-serif;background:var(--bg);color:var(--tx)}
header{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;background:var(--card);border-bottom:1px solid var(--bd);position:sticky;top:0}
header b{color:var(--pr)}main{max-width:760px;margin:0 auto;padding:16px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:14px;margin:10px 0}
button,input,textarea,select{font:inherit;color:inherit}
button{background:var(--pr);color:#fff;border:0;border-radius:8px;padding:8px 14px;cursor:pointer}
button.s{background:none;color:var(--pr);border:1px solid var(--pr)}button.l{background:none;color:var(--mu);padding:4px 8px}
input,textarea,select{width:100%;padding:8px;margin:4px 0 10px;border:1px solid var(--bd);border-radius:8px;background:var(--bg)}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0}.tabs button{background:none;color:var(--tx);border:1px solid var(--bd)}.tabs button.on{background:var(--pr);color:#fff}
.mu{color:var(--mu);font-size:.9em}.er{color:var(--er)}.ok{color:var(--pr)}
.msg{padding:6px 0;border-bottom:1px solid var(--bd)}.msg.me{background:rgba(11,110,79,.07)}
label.o{display:block;padding:6px 8px;border:1px solid var(--bd);border-radius:8px;margin:4px 0;cursor:pointer}label.o input{width:auto;margin:0 8px 0 0}
</style>
</head>
<body>
<header><b>Plateforme de formation</b><span><button id="inst" class="s" style="display:none" onclick="installApp()">📲 Installer</button><span id="nav"></span></span></header>
<main id="app"></main>
<script>
// >>> Coller ici l'URL /exec du déploiement Apps Script <<<
const API_URL = 'COLLER_ICI_URL_EXEC';
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let tok = localStorage.getItem('tok'), pseudo = localStorage.getItem('pseudo'), adminPw = null, timer = null, cur = null;

async function api(action, ...args) {
  try { return await (await fetch(API_URL, { method: 'POST', body: JSON.stringify({ action, args }) })).json(); }
  catch (e) { return { ok: false, message: 'Connexion impossible.' }; }
}
function view(html) { clearInterval(timer); $('#app').innerHTML = html; window.scrollTo(0, 0); }
function nav() {
  $('#nav').innerHTML = tok ? `<button class="l" onclick="home()">Mes cours</button><button class="l" onclick="profile()">${esc(pseudo)}</button><button class="l" onclick="logout()">Quitter</button>` : `<button class="l" onclick="admin()">Admin</button>`;
}
function setSession(r) { tok = r.token; pseudo = r.pseudo; localStorage.setItem('tok', tok); localStorage.setItem('pseudo', pseudo); }
function logout() { tok = null; localStorage.clear(); auth(); }
function fail(r) { if (/Session expirée/.test(r.message || '')) return logout(); alert(r.message || 'Erreur'); }

/* ---------- Connexion / inscription ---------- */
function auth(msg) {
  nav();
  view(`<div class="card"><h2>Bienvenue</h2><p class="mu">Première visite ? Choisissez un pseudonyme et un mot de passe : votre compte est créé tout de suite, sans validation.</p>
  <input id="p" placeholder="Pseudonyme (3 à 30 caractères, sans espace)" autocapitalize="off"><input id="w" type="password" placeholder="Mot de passe (6 caractères minimum)">
  <p class="er" id="m">${esc(msg || '')}</p><button onclick="doAuth()">Continuer</button></div>`);
}
async function doAuth() {
  const r = await api('login', $('#p').value, $('#w').value);
  if (!r.ok) return ($('#m').textContent = r.message);
  setSession(r); if (r.created) alert('Compte créé. Bienvenue !'); home();
}

/* ---------- Accueil : mes cours + catalogue ---------- */
async function home() {
  if (!tok) return auth(); nav(); view('<p class="mu">Chargement…</p>');
  const r = await api('me', tok); if (!r.ok) return fail(r);
  const item = c => `<div class="card"><b>${esc(c.titre)}</b><p class="mu">${esc(c.description)}</p>${c.inscrit
    ? `<button onclick="openCourse('${c.id}')">Ouvrir</button> <button class="l" onclick="leave('${c.id}')">Me désinscrire</button>`
    : `<button class="s" onclick="join('${c.id}')">S’inscrire</button>`}</div>`;
  const mine = r.cours.filter(c => c.inscrit), other = r.cours.filter(c => !c.inscrit);
  view(`<h2>Mes cours</h2>${mine.map(item).join('') || '<p class="mu">Vous n’êtes inscrit à aucun cours.</p>'}<h2>Cours disponibles</h2>${other.map(item).join('') || '<p class="mu">Aucun autre cours.</p>'}`);
}
async function join(id) { const r = await api('enroll', tok, id); r.ok ? openCourse(id) : fail(r); }
async function leave(id) { if (confirm('Se désinscrire de ce cours ?')) { await api('unenroll', tok, id); home(); } }

/* ---------- Profil ---------- */
async function profile() {
  view('<p class="mu">Chargement…</p>');
  const r = await api('profil', tok); if (!r.ok) return fail(r);
  view(`<div class="card"><h2>Mon profil</h2><p class="mu">Compte créé le ${new Date(r.cree).toLocaleDateString('fr-FR')}</p>
  <label>Pseudonyme</label><input id="np" value="${esc(r.pseudo)}" autocapitalize="off">
  <label>Nouveau mot de passe (laisser vide pour ne pas changer)</label><input id="nw" type="password" placeholder="6 caractères minimum">
  <p id="m" class="er"></p><button onclick="saveProfile()">Enregistrer</button></div>
  <h3>Mes cours et résultats</h3>${r.cours.map(c => `<div class="card"><b>${esc(c.titre)}</b><p class="mu">Pré-test : ${c.pre || 'non passé'} · Post-test : ${c.post || 'non passé'}</p><button class="s" onclick="openCourse('${c.id}')">Ouvrir</button></div>`).join('') || '<p class="mu">Aucune inscription.</p>'}`);
}
async function saveProfile() {
  const r = await api('updateProfile', tok, $('#np').value, $('#nw').value);
  if (!r.ok) return ($('#m').className = 'er', $('#m').textContent = r.message);
  pseudo = r.pseudo; localStorage.setItem('pseudo', pseudo); nav(); $('#nw').value = ''; $('#m').className = 'ok'; $('#m').textContent = 'Enregistré.';
}

/* ---------- Page d'un cours ---------- */
async function openCourse(id, tab) {
  view('<p class="mu">Chargement…</p>');
  const r = await api('course', tok, id); if (!r.ok) { fail(r); return home(); }
  cur = r; tab = tab || 'docs';
  const T = [['docs', 'Documents'], ['Pré-test', 'Pré-test'], ['Post-test', 'Post-test'], ['chat', 'Discussion']];
  view(`<h2>${esc(r.titre)}</h2><p class="mu">${esc(r.description)}</p>
  <div class="tabs">${T.map(t => `<button class="${t[0] === tab ? 'on' : ''}" onclick="openCourse('${id}','${t[0]}')">${t[1]}</button>`).join('')}</div><div id="tab"></div>`);
  if (tab === 'docs') $('#tab').innerHTML = r.documents.map(d => `<div class="card">📄 <a href="${esc(d.url)}" target="_blank" rel="noopener">${esc(d.titre)}</a></div>`).join('') || '<p class="mu">Aucun document pour le moment.</p>';
  else if (tab === 'chat') chat(id);
  else testHome(id, tab);
}

/* ---------- Tests ---------- */
function testHome(id, ph) {
  const res = cur.resultats[ph], n = cur.nbQuestions[ph];
  $('#tab').innerHTML = res ? `<div class="card"><b>${ph} terminé</b><p class="ok">Score : ${res.score} / ${res.total}</p></div>`
    : n ? `<div class="card"><p>${n} question(s). Vous ne pouvez passer ce test qu’une fois.</p><button onclick="startTest('${id}','${ph}')">Commencer le ${ph.toLowerCase()}</button></div>`
    : '<p class="mu">Ce test n’est pas encore prêt.</p>';
}
async function startTest(id, ph) {
  const r = await api('startTest', tok, id, ph); if (!r.ok) return alert(r.message);
  $('#tab').innerHTML = r.questions.map((q, n) => `<div class="card" data-q="${q.id}"><b>${n + 1}. ${esc(q.q)}</b>${q.multi ? '<div class="mu">Plusieurs réponses possibles</div>' : ''}
    ${q.o.map(o => `<label class="o"><input type="${q.multi ? 'checkbox' : 'radio'}" name="q${q.id}" value="${o.i}">${esc(o.t)}</label>`).join('')}</div>`).join('')
    + `<button onclick="sendTest('${id}','${ph}')">Envoyer mes réponses</button>`;
}
async function sendTest(id, ph) {
  const rep = {}; document.querySelectorAll('[data-q]').forEach(c => rep[c.dataset.q] = [...c.querySelectorAll('input:checked')].map(i => +i.value));
  const r = await api('submitTest', tok, id, ph, rep); if (!r.ok) return alert(r.message);
  cur.resultats[ph] = { score: r.score, total: r.total };
  $('#tab').innerHTML = `<div class="card"><h3 class="ok">Score : ${r.score} / ${r.total}</h3></div>` + r.corrige.map(c => `<div class="card"><b>${esc(c.q)}</b>
    <div class="${c.ok ? 'ok' : 'er'}">${c.ok ? '✔ Correct' : '✘ Incorrect'}</div><div class="mu">Bonne réponse : ${c.bonnes.map(esc).join(' ; ')}</div><div>${esc(c.explication)}</div></div>`).join('');
}

/* ---------- Discussion ---------- */
async function chat(id) {
  $('#tab').innerHTML = `<div id="ms"></div><textarea id="tx" rows="2" placeholder="Votre message…" maxlength="1000"></textarea><button onclick="send('${id}')">Envoyer</button>`;
  const load = async () => {
    const r = await api('getMessages', tok, id); if (!r.ok || !$('#ms')) return;
    $('#ms').innerHTML = r.messages.map(m => `<div class="msg ${m.mine ? 'me' : ''}"><b>${esc(m.pseudo)}</b> <span class="mu">${new Date(m.date).toLocaleString('fr-FR')}</span><br>${esc(m.texte).replace(/\n/g, '<br>')}
      ${m.mine ? `<br><button class="l" onclick="editMsg('${m.id}','${id}')">Modifier</button><button class="l" onclick="delMsg('${m.id}','${id}')">Supprimer</button>` : ''}</div>`).join('') || '<p class="mu">Soyez le premier à écrire.</p>';
  };
  window.reloadChat = load; await load(); timer = setInterval(load, 15000);
}
async function send(id) { const t = $('#tx').value; if (!t.trim()) return; const r = await api('postMessage', tok, id, t); r.ok ? ($('#tx').value = '', reloadChat()) : fail(r); }
async function editMsg(m, id) { const t = prompt('Modifier le message :'); if (t) { await api('editMessage', tok, m, t); reloadChat(); } }
async function delMsg(m, id) { if (confirm('Supprimer ce message ?')) { await api('deleteMessage', tok, m); reloadChat(); } }

/* ---------- Administrateur ---------- */
function admin() {
  nav(); view(`<div class="card"><h2>Espace administrateur</h2><input id="aw" type="password" placeholder="Mot de passe administrateur"><p id="m" class="er"></p>
  <button onclick="adminIn()">Entrer</button> <button class="s" onclick="tok?home():auth()">Retour</button></div>`);
}
async function adminIn() { adminPw = $('#aw').value; const r = await api('adminLogin', adminPw); r.ok ? adminHome() : ($('#m').textContent = r.message); }
async function adminHome() {
  const r = await api('adminOverview', adminPw); if (!r.ok) return alert(r.message);
  view(`<h2>Administration</h2><div class="card"><h3>Nouveau cours</h3><input id="ct" placeholder="Titre"><textarea id="cd" rows="2" placeholder="Description"></textarea><button onclick="saveCourse()">Créer le cours</button></div>
  ${r.cours.map(c => `<div class="card"><b>${esc(c.titre)}</b> ${c.actif ? '' : '<span class="er">(masqué)</span>'}<p class="mu">${c.inscrits} inscrit(s) · ${c.documents} document(s) · ${c.pre} Q pré-test · ${c.post} Q post-test · moyenne pré ${c.moyPre ?? '–'} % / post ${c.moyPost ?? '–'} %</p>
  <button class="s" onclick="adminCourse('${c.id}','${esc(c.titre).replace(/'/g, '’')}')">Ajouter documents / questions</button></div>`).join('')}
  <p class="mu">Pour masquer un cours ou corriger une donnée, modifiez directement le Google Sheet (colonne « actif » = FALSE).</p>`);
}
async function saveCourse() { const r = await api('adminSaveCourse', adminPw, { titre: $('#ct').value, description: $('#cd').value }); r.ok ? adminHome() : alert(r.message); }
function adminCourse(id, titre) {
  view(`<h2>${titre}</h2><button class="s" onclick="adminHome()">← Retour</button>
  <div class="card"><h3>Ajouter un document</h3><input id="dt" placeholder="Titre du document"><input id="du" placeholder="Lien (Drive, YouTube, site…)"><input id="df" type="file">
  <button onclick="addDoc('${id}')">Ajouter</button></div>
  <div class="card"><h3>Ajouter une question</h3><select id="qp"><option>Pré-test</option><option>Post-test</option></select>
  <textarea id="qq" rows="2" placeholder="Question"></textarea><textarea id="qo" rows="4" placeholder="Un choix par ligne"></textarea>
  <input id="qb" placeholder="Numéros des bonnes réponses, ex. 2 ou 1,3"><textarea id="qe" rows="2" placeholder="Explication (affichée après le test)"></textarea>
  <button onclick="addQ('${id}')">Ajouter</button></div>`);
}
async function addDoc(id) {
  const doc = { titre: $('#dt').value, url: $('#du').value }, f = $('#df').files[0];
  if (f) doc.fichier = { nom: f.name, mime: f.type || 'application/octet-stream', b64: await new Promise(ok => { const x = new FileReader(); x.onload = () => ok(x.result.split(',')[1]); x.readAsDataURL(f); }) };
  const r = await api('adminAddDoc', adminPw, id, doc); alert(r.ok ? 'Document ajouté.' : r.message);
}
async function addQ(id) {
  const q = { phase: $('#qp').value, question: $('#qq').value, options: $('#qo').value.split('\n'), explication: $('#qe').value,
    bonnes: $('#qb').value.split(/[,;\s]+/).filter(Boolean).map(n => n - 1) };
  const r = await api('adminAddQuestion', adminPw, id, q);
  if (r.ok) { alert('Question ajoutée.'); ['qq', 'qo', 'qb', 'qe'].forEach(k => $('#' + k).value = ''); } else alert(r.message);
}

/* ---------- Application installable (PWA) ---------- */
let evInstall = null;
const standalone = matchMedia('(display-mode: standalone)').matches || navigator.standalone;
const ios = /iphone|ipad|ipod/i.test(navigator.userAgent);
if (!standalone) {
  if (ios) $('#inst').style.display = '';
  window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); evInstall = e; $('#inst').style.display = ''; });
}
async function installApp() {
  if (evInstall) { evInstall.prompt(); await evInstall.userChoice; evInstall = null; $('#inst').style.display = 'none'; }
  else alert('Sur iPhone : touchez le bouton Partager de Safari, puis « Sur l’écran d’accueil ».');
}
window.addEventListener('appinstalled', () => { $('#inst').style.display = 'none'; });
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});

tok ? home() : auth();
</script>
</body>
</html>
